services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nodvira-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Container path; bind-mounted to host /var/www/nodvira-data/uploads below.
      UPLOAD_DIR: /app/backend/uploads
    extra_hosts:
      # Reach host PostgreSQL from the backend container via host.docker.internal.
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    volumes:
      - /var/www/nodvira-data/uploads:/app/backend/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodvira-web
    depends_on:
      - backend
    ports:
      - "3030:80"
    restart: unless-stopped
