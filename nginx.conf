map $http_x_forwarded_proto $nodvira_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # Eski HTML adreslerini temiz URL'lere yonlendir (yalnizca dis istekler).
    # Not: try_files ile ic redirect kullanma — aksi halde asagidaki 301'ler
    # temiz URL -> .html -> 301 -> temiz URL dongusu olusturur (ERR_TOO_MANY_REDIRECTS).
    location = /hizmetler.html { return 301 /hizmetlerimiz$is_args$args; }
    location = /web-tasarim.html { return 301 /hizmetlerimiz/web-cozumleri$is_args$args; }
    location = /yazilim-cozumleri.html { return 301 /hizmetlerimiz/yazilim-cozumleri$is_args$args; }
    location = /network.html { return 301 /hizmetlerimiz/network-cozumleri$is_args$args; }
    location = /sistem-cozumleri.html { return 301 /hizmetlerimiz/sistem-cozumleri$is_args$args; }
    location = /cozumler.html { return 301 /hizmetlerimiz/teknoloji-danismanligi$is_args$args; }
    location = /projeler.html { return 301 /referanslarimiz$is_args$args; }
    location = /hakkimda.html { return 301 /hakkimizda$is_args$args; }
    location = /blog.html { return 301 /blog$is_args$args; }
    location = /sss.html { return 301 /sss$is_args$args; }
    location = /iletisim.html { return 301 /iletisim$is_args$args; }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ =404;
    }

    location = /referans-detay.html {
        if ($arg_project = web) { return 301 /referanslarimiz/kurumsal-web-platformu; }
        if ($arg_project = software) { return 301 /referanslarimiz/soguk-zincir-istisna-yonetimi; }
        if ($arg_project = network) { return 301 /referanslarimiz/ag-standardizasyonu; }
        if ($arg_project = system) { return 301 /referanslarimiz/sistem-modernizasyonu; }
        if ($arg_project = consulting) { return 301 /referanslarimiz/teknoloji-yol-haritasi; }
        return 301 /referanslarimiz;
    }

    location = /blog-detay.html {
        if ($arg_slug != "") { return 301 /blog/$arg_slug; }
        return 301 /blog;
    }

    # Temiz URL -> statik dosya (rewrite break: location yeniden eslesmez, 301 dongusu yok).
    location = /hizmetlerimiz {
        rewrite ^ /hizmetler.html break;
    }
    location = /hizmetlerimiz/web-cozumleri {
        rewrite ^ /web-tasarim.html break;
    }
    location = /hizmetlerimiz/yazilim-cozumleri {
        rewrite ^ /yazilim-cozumleri.html break;
    }
    location = /hizmetlerimiz/network-cozumleri {
        rewrite ^ /network.html break;
    }
    location = /hizmetlerimiz/sistem-cozumleri {
        rewrite ^ /sistem-cozumleri.html break;
    }
    location = /hizmetlerimiz/teknoloji-danismanligi {
        rewrite ^ /cozumler.html break;
    }
    location = /referanslarimiz {
        rewrite ^ /projeler.html break;
    }
    location ~ ^/referanslarimiz/[^/]+/?$ {
        rewrite ^ /referans-detay.html break;
    }
    location = /hakkimizda {
        rewrite ^ /hakkimda.html break;
    }
    location = /blog {
        rewrite ^ /blog.html break;
    }
    location ~ ^/blog/[^/]+/?$ {
        rewrite ^ /blog-detay.html break;
    }
    location = /sss {
        rewrite ^ /sss.html break;
    }
    location = /iletisim {
        rewrite ^ /iletisim.html break;
    }

    # Backend API is reachable only through the public web proxy.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nodvira_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Uploaded media is stored by the backend on a persistent Docker volume.
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nodvira_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static frontend and admin application.
    # index.html -> / redirect yok: index directive ic redirect'i 301 ile donguye sokardi.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Do not expose docker/build metadata if present
    location ~ /\. {
        deny all;
    }
}
