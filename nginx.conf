server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static mock frontend — no backend / database
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Do not expose docker/build metadata if present
    location ~ /\. {
        deny all;
    }
}
